- Infrastruktura:
    - Proxmox:
        href: "https://proxmox.home:8006"
        description: Hypervisor
        icon: proxmox.png
        widget:
          type: proxmox
          url: https://192.168.1.252:8006
          username: root@pam!homepage
          password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN}}"
          node: Proxmox
          verify: false
          fields: ["vms", "lxc", "cpu", "mem"]
    - AdGuard Home:
        href: "http://dns.home"
        description: DNS + blokowanie reklam (Raspberry Pi)
        icon: adguard-home.png
        widget:
          type: adguard
          url: http://192.168.1.253
          username: szymon
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
