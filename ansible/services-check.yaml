---
- name: Ensure nginx is running
  hosts: nginx
  become: true
  tasks:
    - name: Ensure nginx is running
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

- name: Ensure Zabbix server is running
  hosts: zabbix
  become: true
  tasks:
    - name: Ensure zabbix-server is running
      ansible.builtin.systemd:
        name: zabbix-server
        state: started
        enabled: true

- name: Ensure Vault is running
  hosts: vault
  become: true
  tasks:
    # Only checks the systemd unit. After a restart Vault is sealed and
    # still needs a Shamir unseal (3-of-5) — this play does not do that.
    - name: Ensure vault is running
      ansible.builtin.systemd:
        name: vault
        state: started
        enabled: true

# Nextcloud, Cloud-Floci and Homepage all run as Docker Compose stacks,
# so the docker daemon is the unit to check.
- name: Ensure Docker-based stacks are running
  hosts: nextcloud:floci:homepage
  become: true
  tasks:
    - name: Ensure docker is running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
